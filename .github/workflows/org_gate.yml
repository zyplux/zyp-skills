name: org_gate

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to refresh
        required: true
        type: string
      sha:
        description: Pull request head commit to evaluate
        type: string

permissions:
  statuses: write
  checks: read
  pull-requests: read

jobs:
  org_gate_base:
    uses: zyplux/.github/.github/workflows/org_gate_base.yml@main
    with:
      pr: ${{ inputs.pr || '' }}
      sha: ${{ inputs.sha || '' }}
